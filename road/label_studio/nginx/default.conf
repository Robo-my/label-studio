# One address for the interns. Label Studio stays unchanged; our features live in road-captions.
server {
    listen 80;
    client_max_body_size 200m;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Our features: the road-captions container.
    location /road-api/ {
        proxy_pass http://road-captions:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Label Studio. nginx adds one script tag to its HTML pages; nothing else changes.
    location / {
        proxy_pass http://label-studio:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";  # sub_filter can only edit uncompressed HTML
        sub_filter_types text/html;
        sub_filter '</head>' '<script src="/road-api/static/road-captions.js" defer></script></head>';
        sub_filter_once on;
        proxy_read_timeout 300s;
    }
}
